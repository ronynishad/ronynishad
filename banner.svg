<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Rony Nishad — Aspiring Full-Stack Developer</title>
  <desc id="desc">A dark navy and cyan developer banner with abstract circuit lines and a code symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#10243b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity=".65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="100" r="180" fill="#0891b2" opacity=".09"/>
  <circle cx="1080" cy="240" r="130" fill="#22d3ee" opacity=".06"/>
  <g stroke="url(#glow)" stroke-width="2" fill="none">
    <path d="M760 0 V55 H850 V95 H960"/>
    <path d="M840 320 V270 H925 V230 H1200"/>
    <path d="M1020 0 V45 H1100 V80"/>
    <path d="M730 250 H800 V210 H870"/>
    <path d="M940 135 H1020 V170 H1140"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="850" cy="55" r="4"/><circle cx="960" cy="95" r="4"/>
    <circle cx="925" cy="230" r="4"/><circle cx="1100" cy="45" r="4"/>
    <circle cx="800" cy="210" r="4"/><circle cx="1020" cy="170" r="4"/>
  </g>
  <rect x="70" y="58" width="5" height="204" rx="2.5" fill="#22d3ee"/>
  <text x="105" y="118" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="4">HELLO, WORLD!</text>
  <text x="100" y="178" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">RONY NISHAD</text>
  <text x="103" y="218" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="23">Aspiring Full-Stack Developer</text>
  <text x="103" y="255" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">&lt; learn / build / improve /&gt;</text>
  <g transform="translate(930 115)" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 0 L0 35 L35 70"/>
    <path d="M105 0 L140 35 L105 70"/>
    <path d="M88 -5 L52 75"/>
  </g>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="none" stroke="#164e63" stroke-width="2"/>
